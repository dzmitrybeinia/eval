<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Issues Analysis Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            background: white;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 0;
        }

        .nav-tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            background: #f8fafc;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            border-right: 1px solid #e1e8ed;
        }

        .nav-tab:last-child {
            border-right: none;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .nav-tab:hover:not(.active) {
            background: #e2e8f0;
        }

        .tab-content {
            background: white;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            min-height: 600px;
        }

        .tab-panel {
            display: none;
            padding: 30px;
        }

        .tab-panel.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border-left: 4px solid #667eea;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card .subtext {
            font-size: 0.85rem;
            color: #888;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .language-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }

        .language-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
        }

        .language-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
        }

        .severity-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-high { background: #fecaca; color: #dc2626; }
        .severity-medium { background: #fed7aa; color: #c2410c; }
        .severity-low { background: #fef3c7; color: #92400e; }

        .pattern-list {
            list-style: none;
        }

        .pattern-item {
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pattern-item:last-child {
            border-bottom: none;
        }

        .pattern-name {
            font-weight: 500;
            color: #333;
            flex: 1;
        }

        .pattern-frequency {
            background: #e0e7ff;
            color: #4338ca;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 10px;
        }

        .recommendations-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .recommendation-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border-left: 4px solid #22c55e;
        }

        .priority-high { border-left-color: #dc2626; }
        .priority-medium { border-left-color: #f59e0b; }
        .priority-low { border-left-color: #22c55e; }

        .recommendation-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .priority-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: auto;
        }

        .priority-high-badge { background: #fecaca; color: #dc2626; }
        .priority-medium-badge { background: #fed7aa; color: #c2410c; }
        .priority-low-badge { background: #dcfce7; color: #166534; }

        .recommendation-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .recommendation-impact {
            color: #666;
            margin-bottom: 10px;
        }

        .recommendation-implementation {
            color: #888;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .automation-potential {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 5px;
        }

        .automation-high { background: #dcfce7; color: #166534; }
        .automation-medium { background: #fef3c7; color: #92400e; }
        .automation-low { background: #fee2e2; color: #991b1b; }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .nav-tabs {
                flex-direction: column;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .language-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Common Issues Analysis Dashboard</h1>
            <p>Cross-language error pattern analysis with severity and frequency insights</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('patterns')">🎯 Error Patterns</button>
            <button class="nav-tab" onclick="showTab('languages')">🌍 Languages</button>
        </div>

        <div class="tab-content">
            <!-- Error Patterns Tab -->
            <div id="patterns" class="tab-panel active">
                <div class="filters">
                    <div class="filter-group">
                        <label for="languageFilter">Filter by Language</label>
                        <select id="languageFilter">
                            <option value="all">All Languages</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="severityFilter">Filter by Severity</label>
                        <select id="severityFilter">
                            <option value="all">All Severities</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="categoryFilter">Filter by Category</label>
                        <select id="categoryFilter">
                            <option value="all">All Categories</option>
                            <option value="linguistic">Linguistic</option>
                            <option value="localization">Localization</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="frequencyFilter">Filter by Frequency</label>
                        <select id="frequencyFilter">
                            <option value="all">All Frequencies</option>
                            <option value="very_common">Very Common</option>
                            <option value="common">Common</option>
                            <option value="occasional">Occasional</option>
                            <option value="rare">Rare</option>
                        </select>
                    </div>
                </div>

                <div id="patternsContent">
                    <!-- Pattern cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Languages Tab -->
            <div id="languages" class="tab-panel">
                <div class="language-grid" id="languageGrid">
                    <!-- Language cards will be populated by JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <script>
        let commonIssuesData = null;
        let charts = {};

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadCommonIssuesData();
        });

        async function loadCommonIssuesData() {
            showLoading();
            
            try {
                const response = await fetch('issues/all/all_common_issues.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                commonIssuesData = await response.json();
                console.log('📋 Loaded common issues data:', commonIssuesData);
                
                initializeDashboard();
                
            } catch (error) {
                console.error('Error loading common issues data:', error);
                showError('Failed to load common issues data. Please check console for details.');
            }
        }

        function showLoading() {
            // Show loading only in specific content areas
            const contentElements = [
                'patternsContent',
                'languageGrid', 
                'recommendationsGrid'
            ];
            
            contentElements.forEach(elementId => {
                const element = document.getElementById(elementId);
                if (element) {
                    element.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <div>Loading analysis data...</div>
                        </div>
                    `;
                }
            });
        }

        function showError(message) {
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.innerHTML = `
                    <div class="loading">
                        <div>❌ ${message}</div>
                    </div>
                `;
            });
        }

        function initializeDashboard() {
            populateLanguageFilter();
            populatePatternsTab();
            populateLanguagesTab();
        }

        function populateLanguageFilter() {
            const languageFilter = document.getElementById('languageFilter');
            if (languageFilter) {
                languageFilter.innerHTML = '<option value="all">All Languages</option>';
                
                commonIssuesData.languages.forEach(language => {
                    const option = document.createElement('option');
                    option.value = language;
                    option.textContent = language.charAt(0).toUpperCase() + language.slice(1);
                    languageFilter.appendChild(option);
                });

                languageFilter.addEventListener('change', filterPatterns);
            }

            // Setup other filters
            const severityFilter = document.getElementById('severityFilter');
            const categoryFilter = document.getElementById('categoryFilter');
            const frequencyFilter = document.getElementById('frequencyFilter');
            
            if (severityFilter) severityFilter.addEventListener('change', filterPatterns);
            if (categoryFilter) categoryFilter.addEventListener('change', filterPatterns);
            if (frequencyFilter) frequencyFilter.addEventListener('change', filterPatterns);
        }

        function populatePatternsTab() {
            const patternsContent = document.getElementById('patternsContent');
            let allPatterns = [];

            commonIssuesData.languages.forEach(language => {
                const analysis = commonIssuesData.analyses[language];
                if (analysis && analysis.top_error_patterns) {
                    analysis.top_error_patterns.forEach(pattern => {
                        allPatterns.push({
                            ...pattern,
                            language: language
                        });
                    });
                }
            });

            // Sort by impact level and frequency
            allPatterns.sort((a, b) => {
                const impactOrder = { 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1 };
                const freqOrder = { 'very_common': 4, 'common': 3, 'occasional': 2, 'rare': 1 };
                
                if (impactOrder[a.impact_level] !== impactOrder[b.impact_level]) {
                    return impactOrder[b.impact_level] - impactOrder[a.impact_level];
                }
                return freqOrder[b.frequency] - freqOrder[a.frequency];
            });

            renderPatterns(allPatterns);
        }

        function renderPatterns(patterns) {
            const patternsContent = document.getElementById('patternsContent');
            if (!patternsContent) {
                console.error('Could not find patternsContent element');
                return;
            }
            
            if (patterns.length === 0) {
                patternsContent.innerHTML = '<div class="loading">No patterns match the current filters.</div>';
                return;
            }

            let html = '';
            patterns.forEach((pattern) => {
                const examples = pattern.examples ? pattern.examples.slice(0, 2) : [];
                const frequencyLabel = pattern.frequency || 'unknown';
                const frequencyCount = pattern.frequency_count != null ? pattern.frequency_count : '–';

                html += `
                    <div class="language-card">
                        <div class="language-header">
                            <div>
                                <div class="language-name">${pattern.pattern_name}</div>
                                <div style="color: #666; font-size: 0.9rem; margin-top: 5px;">
                                    ${pattern.language.charAt(0).toUpperCase() + pattern.language.slice(1)} • 
                                    ${pattern.category}/${pattern.subcategory}
                                </div>
                            </div>
                            <div>
                                <div class="severity-badge severity-${pattern.impact_level.toLowerCase()}">${pattern.impact_level}</div>
                                <div class="pattern-frequency" style="margin-top: 5px;">${frequencyLabel} • ${frequencyCount}</div>
                            </div>
                        </div>

                        ${pattern.description ? `
                        <div style="margin-bottom: 15px;">
                            <strong>Description:</strong> ${pattern.description}
                        </div>
                        ` : ''}

                        ${examples.length > 0 ? `
                        <div style="margin-bottom: 15px;">
                            <strong>Examples:</strong>
                            ${examples.map(ex => `
                                <div style="margin: 8px 0; padding: 10px; background: #f8fafc; border-radius: 6px; border-left: 3px solid #dc2626;">
                                    <div style="color: #dc2626; font-weight: 500;">❌ ${ex.wrong}</div>
                                    <div style="color: #059669; font-weight: 500; margin-top: 4px;">✅ ${ex.correct}</div>
                                    ${ex.context ? `<div style="color: #6b7280; font-size: 0.9rem; margin-top: 4px;">Context: ${ex.context}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            patternsContent.innerHTML = html;
        }

        function filterPatterns() {
            const languageFilter = document.getElementById('languageFilter');
            const severityFilter = document.getElementById('severityFilter');
            const categoryFilter = document.getElementById('categoryFilter');
            
            if (!languageFilter) return;

            let allPatterns = [];

            commonIssuesData.languages.forEach(language => {
                const analysis = commonIssuesData.analyses[language];
                if (analysis && analysis.top_error_patterns) {
                    analysis.top_error_patterns.forEach(pattern => {
                        allPatterns.push({
                            ...pattern,
                            language: language
                        });
                    });
                }
            });

            // Apply filters
            const frequencyFilter = document.getElementById('frequencyFilter');
            const filteredPatterns = allPatterns.filter(pattern => {
                const languageMatch = languageFilter.value === 'all' || pattern.language === languageFilter.value;
                const severityMatch = !severityFilter || severityFilter.value === 'all' || pattern.impact_level === severityFilter.value;
                const categoryMatch = !categoryFilter || categoryFilter.value === 'all' || pattern.category === categoryFilter.value;
                const frequencyMatch = !frequencyFilter || frequencyFilter.value === 'all' || pattern.frequency === frequencyFilter.value;

                return languageMatch && severityMatch && categoryMatch && frequencyMatch;
            });

            // Sort filtered patterns
            filteredPatterns.sort((a, b) => {
                const impactOrder = { 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1 };
                const freqOrder = { 'very_common': 4, 'common': 3, 'occasional': 2, 'rare': 1 };
                const freqCountA = Number(a.frequency_count) || 0;
                const freqCountB = Number(b.frequency_count) || 0;

                if (impactOrder[a.impact_level] !== impactOrder[b.impact_level]) {
                    return impactOrder[b.impact_level] - impactOrder[a.impact_level];
                }
                if (freqCountA !== freqCountB) {
                    return freqCountB - freqCountA;
                }
                return (freqOrder[b.frequency] || 0) - (freqOrder[a.frequency] || 0);
            });

            renderPatterns(filteredPatterns);
        }

        function populateLanguagesTab() {
            const languageGrid = document.getElementById('languageGrid');
            if (!languageGrid) {
                console.error('Could not find languageGrid element');
                return;
            }
            let html = '';

            commonIssuesData.languages.forEach(language => {
                const analysis = commonIssuesData.analyses[language];
                if (!analysis) return;

                const patterns = analysis.top_error_patterns || [];
                const severityPriority = { 'HIGH': 3, 'MEDIUM': 2, 'LOW': 1 };
                const highPatterns = patterns.filter(p => p.impact_level === 'HIGH').length;
                const highestPattern = patterns.slice().sort((a, b) => {
                    if (severityPriority[b.impact_level] !== severityPriority[a.impact_level]) {
                        return severityPriority[b.impact_level] - severityPriority[a.impact_level];
                    }
                    const freqA = Number.isFinite(a.frequency_count) ? a.frequency_count : 0;
                    const freqB = Number.isFinite(b.frequency_count) ? b.frequency_count : 0;
                    return freqB - freqA;
                })[0];
                const overallSeverity = highestPattern ? highestPattern.impact_level : 'LOW';
                const mostCritical = highestPattern ? highestPattern.pattern_name : 'N/A';
                const totalFrequency = patterns.reduce((sum, p) => sum + (Number(p.frequency_count) || 0), 0);

                html += `
                    <div class="language-card">
                        <div class="language-header">
                            <div class="language-name">${language.charAt(0).toUpperCase() + language.slice(1)}</div>
                            <div class="severity-badge severity-${overallSeverity.toLowerCase()}">
                                ${overallSeverity}
                            </div>
                        </div>
                        
                        <div style="margin-bottom: 15px;">
                            <strong>Most Critical Pattern:</strong><br>
                            <span style="font-size: 0.9rem; color: #dc2626;">${mostCritical}</span>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 15px 0;">
                            <div style="text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #333;">${patterns.length}</div>
                                <div style="font-size: 0.8rem; color: #666;">Total Patterns</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #dc2626;">${highPatterns}</div>
                                <div style="font-size: 0.8rem; color: #666;">High Severity</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: 700; color: #059669;">${totalFrequency}</div>
                                <div style="font-size: 0.8rem; color: #666;">Total Instances</div>
                            </div>
                        </div>
                        
                        <div>
                            <strong>All Error Patterns:</strong>
                            <ul class="pattern-list">
                                ${patterns.map(pattern => `
                                    <li class="pattern-item">
                                        <span class="pattern-name">${pattern.pattern_name}</span>
                                        <div style="display: flex; gap: 5px; align-items: center;">
                                            <span class="severity-badge severity-${pattern.impact_level.toLowerCase()}" style="font-size: 0.7rem; padding: 2px 6px;">
                                                ${pattern.impact_level}
                                            </span>
                                            <span class="pattern-frequency" style="margin-left: 0;">${pattern.frequency} • ${pattern.frequency_count || 0}</span>
                                        </div>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            });

            languageGrid.innerHTML = html;
        }

        function showTab(tabName) {
            // Hide all tab panels
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab panel
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to clicked tab
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
